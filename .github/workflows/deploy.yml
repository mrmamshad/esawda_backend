name: Deploy Laravel Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Public SSLCommerz sandbox creds — only unlock the fail-closed creds
      # gate in tests; checkout tests stub the HTTP layer with Http::fake.
      SSLCOMMERZ_STORE_ID: testbox
      SSLCOMMERZ_STORE_PASSWORD: qwerty
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
      - name: Tests (PHPUnit)
        run: ./vendor/bin/phpunit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/esawda-api/htdocs/api.esawda.com
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan optimize

            # ── Background workers (transactional emails, image jobs,
            #    fulfilment, scheduler). Ensured idempotently on every deploy
            #    from the unit files in the repo (deploy/*.service) so they
            #    can never silently drift from the real app path. Each sudo is
            #    guarded: if the deploy user lacks passwordless sudo the code
            #    still ships — the worker step is only skipped with a warning.
            APP_DIR=/home/esawda-api/htdocs/api.esawda.com
            for unit in esawda-queue esawda-scheduler; do
              if sudo -n test -f "$APP_DIR/deploy/$unit.service"; then
                sudo -n cp "$APP_DIR/deploy/$unit.service" "/etc/systemd/system/$unit.service" \
                  && sudo -n systemctl daemon-reload \
                  && sudo -n systemctl enable --now "$unit" \
                  && echo "ensured systemd unit: $unit" \
                  || echo "WARN: could not install $unit (no passwordless sudo?) — follow DEPLOY.md §6"
              else
                echo "WARN: deploy/$unit.service not found; skipping"
              fi
            done
            # Make the running queue worker reload the freshly-deployed code.
            php "$APP_DIR/artisan" queue:restart || true

            curl -sf -o /dev/null -H 'Accept: application/json' https://api.esawda.com/api/v1/categories
